name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pylint
      # Errors fail the build; the full report is informational until the
      # style warnings are cleaned up.
      - name: Pylint errors
        run: pylint --errors-only $(git ls-files '*.py')
      - name: Pylint full report
        run: pylint --exit-zero $(git ls-files '*.py')

  unit:
    # Unit and CLI tests on every supported Python; the tests that need the
    # simulated server are skipped here and run in the server job.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -p no:cacheprovider Tests

  server:
    # The whole suite inside the simulated server, as Tests/run_tests.sh
    # runs it locally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: Tests/run_tests.sh
