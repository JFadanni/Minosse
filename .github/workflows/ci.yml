name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push supersedes the earlier run of a pull request, but every push
  # to main and develop keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runner image is pinned: ubuntu-latest moved to Ubuntu 26.04, where
# setup-python has no Python 3.8 or 3.9. Move to a newer image when those
# are dropped. Actions are pinned to commit SHAs, since tags can be moved;
# Dependabot proposes their updates (.github/dependabot.yml).

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r Tests/requirements-lint.txt
      # Errors fail the build; the full report is informational until the
      # style warnings are cleaned up.
      - name: Pylint errors
        run: pylint --errors-only $(git ls-files '*.py')
      - name: Pylint full report
        if: ${{ !cancelled() }}
        run: pylint --exit-zero $(git ls-files '*.py')

  unit:
    # Unit and CLI tests on every supported Python; the tests that need the
    # simulated server are skipped here and run in the server job.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      # Not pinned: no single pytest supports Python 3.8 to 3.15, so each
      # Python gets the newest one that does.
      - run: python -m pip install pytest
      - run: python -m pytest -p no:cacheprovider Tests

  server:
    # The whole suite inside the simulated server, as Tests/run_tests.sh
    # runs it locally.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: Tests/run_tests.sh
